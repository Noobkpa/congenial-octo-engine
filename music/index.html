      // 主题初始化 - 与setting-utils.ts保持一致
      const LIGHT_MODE = "light";
      const DARK_MODE = "dark";
      const SYSTEM_MODE = "system";

      // 获取存储的主题，如果没有则使用默认值
      const theme = localStorage.getItem("theme") || defaultMode;

      // 获取系统主题
      function getSystemTheme() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? DARK_MODE
          : LIGHT_MODE;
      }

      // 解析主题（如果是system模式，则获取系统主题）
      function resolveTheme(themeValue) {
        if (themeValue === SYSTEM_MODE) {
          return getSystemTheme();
        }
        return themeValue;
      }

      const resolvedTheme = resolveTheme(theme);
      const isDark = resolvedTheme === DARK_MODE;

      // 应用主题
      if (isDark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      // Set the theme for Expressive Code
      document.documentElement.setAttribute(
        "data-theme",
        isDark ? darkTheme : lightTheme
      );

      // Load the hue from local storage

      // calculate the --banner-height-extend, which needs to be a multiple of 4 to avoid blurry text
      // 使用更准确的窗口高度计算
      function calculateBannerHeightExtend() {

        offset = offset - (offset % 4);
        document.documentElement.style.setProperty(

      calculateBannerHeightExtend();

const metingApiBase = "https://mu.tsh520.cn/api";

(function () {
    // Singleton guard – only create once
    if (window.__fireflyMusic) return;

    var config = JSON.parse(managerConfigStr);

    // ── Helpers ──────────────────────────────────────────────
    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        var min = Math.floor(seconds / 60);
        var sec = Math.floor(seconds % 60);
        return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function parseLRC(lrc) {
        if (!lrc) return [];
        var lines = lrc.split('\n');
        var result = [];
        var timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
        lines.forEach(function (line) {
            var matches = Array.from(line.matchAll(timeReg));
            if (matches.length > 0) {
                var text = line.replace(timeReg, '').trim();
                if (text) {
                    matches.forEach(function (match) {
                        var m = parseInt(match[1]);
                        var s = parseInt(match[2]);
                        var ms = parseInt(match[3]);
                        var time = m * 60 + s + ms / (match[3].length === 3 ? 1000 : 100);
                        result.push({ time: time, text: text });
                    });
                }
            }
        });
        return result.sort(function (a, b) { return a.time - b.time; });
    }

    // ── Audio element (persistent, attached to body) ────────
    var audio = document.getElementById('firefly-music-audio') || document.createElement('audio');
    audio.id = 'firefly-music-audio';
    audio.crossOrigin = 'anonymous';
    audio.style.display = 'none';
    if (!audio.parentNode) document.body.appendChild(audio);

    // ── State ────────────────────────────────────────────────
    var state = {

        isPlaying: false,
        playMode: 0, // 0: list, 1: one, 2: random
        volume: localStorage.getItem('music-player-volume') !== null

        isMuted: false,
        lyrics: [],
        currentLrcIndex: -1,
        initialized: false,
        initializing: false,
        error: null
    };

    if (config.playMode === 'random') state.playMode = 2;

    // ── Meting fetch ─────────────────────────────────────────
    async function fetchMetingData() {
        if (!config.meting) return;
        var m = config.meting;
        var apis = [m.api].concat(m.fallbackApis || []);

        for (var i = 0; i < apis.length; i++) {
            var baseApi = apis[i];
            if (!baseApi) continue;
            try {
                var fetchUrl = baseApi
                    .replace(':server', m.server)
                    .replace(':type', m.type)
                    .replace(':id', m.id)
                    .replace(':r', Math.random());
                if (m.auth) fetchUrl += '&auth=' + m.auth;

                var res = await fetch(fetchUrl);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();

                if (Array.isArray(data) && data.length > 0) {
                    state.playlist = data.map(function (item) {
                        return {
                            name: item.title || item.name || 'Unknown',
                            artist: item.author || item.artist || 'Unknown',
                            url: item.url,
                            pic: item.pic || item.cover || '',
                            lrc: item.lrc
                        };
                    });
                    return;
                }
            } catch (e) {
                console.warn('Meting API failed for ' + baseApi, e);
            }
        }
        throw new Error('All Meting APIs failed');
    }

    // ── Lyrics ───────────────────────────────────────────────
        var lrcOffset = parseFloat(localStorage.getItem('music-lrc-offset') || '0') || 0;

        function syncLrcIndex() {
            if (state.lyrics.length === 0) return;
            // offset: negative = lyrics delayed (more natural feel), positive = lyrics ahead
            var ct = audio.currentTime + lrcOffset;
            var idx = -1;
            for (var i = 0; i < state.lyrics.length; i++) {
                if (ct >= state.lyrics[i].time) idx = i;
                else break;
            }
            if (idx !== state.currentLrcIndex) {
                state.currentLrcIndex = idx;
                emit('fm:lrc-index', { index: idx });
            }
        }

    function loadLyrics(track) {
        state.lyrics = [];
        state.currentLrcIndex = -1;

        if (!track.lrc) {
            emit('fm:lyrics', { lyrics: [], status: 'none' });
            return;
        }

        var isLrcUrl = /^(https?:)?\/\//.test(track.lrc)
            || track.lrc.startsWith('/')
            || /\.(lrc|txt)(\?|#|$)/i.test(track.lrc);

        if (isLrcUrl) {
            emit('fm:lyrics', { lyrics: [], status: 'loading' });
            fetch(track.lrc)
                .then(function (r) { return r.text(); })
                .then(function (text) {
                    state.lyrics = parseLRC(text);
                    emit('fm:lyrics', { lyrics: state.lyrics, status: 'loaded' });
                    if (!audio.paused) syncLrcIndex();
                })
                .catch(function () {
                    state.lyrics = [];
                    emit('fm:lyrics', { lyrics: [], status: 'failed' });
                });
        } else {
            state.lyrics = parseLRC(track.lrc);
            emit('fm:lyrics', { lyrics: state.lyrics, status: state.lyrics.length > 0 ? 'loaded' : 'none' });
            if (!audio.paused && state.lyrics.length > 0) syncLrcIndex();
        }
    }

    // ── Track loading ────────────────────────────────────────
    function loadTrack(index, autoPlay) {
        if (index < 0 || index >= state.playlist.length) return;
        state.currentIndex = index;
        var track = state.playlist[index];

        audio.src = track.url;

        loadLyrics(track);

        emit('fm:track', { index: index, track: track, autoPlay: !!autoPlay });

        if (autoPlay) {
            audio.play().then(function () {
                state.isPlaying = true;
                emit('fm:play-state', { isPlaying: true });
            }).catch(function (e) {
                console.warn('Autoplay blocked:', e);
            });
        } else {
            state.isPlaying = false;
            emit('fm:play-state', { isPlaying: false });
        }
    }

    // ── Playback controls ────────────────────────────────────
    function togglePlay() {
        if (audio.paused) {
            audio.play().then(function () {
                state.isPlaying = true;
                emit('fm:play-state', { isPlaying: true });
            });
        } else {
            audio.pause();
            state.isPlaying = false;
            emit('fm:play-state', { isPlaying: false });
        }
    }

    function playNext(auto) {
        if (state.playMode === 1 && auto) {
            audio.currentTime = 0;
            audio.play();
            return;
        }
        var nextIndex;
        if (state.playMode === 2) {
            nextIndex = Math.floor(Math.random() * state.playlist.length);
        } else {
            nextIndex = (state.currentIndex + 1) % state.playlist.length;
        }
        loadTrack(nextIndex, true);
    }

    function playPrev() {
        var prevIndex;
        if (state.playMode === 2) {
            prevIndex = Math.floor(Math.random() * state.playlist.length);
        } else {
            prevIndex = (state.currentIndex - 1 + state.playlist.length) % state.playlist.length;
        }
        loadTrack(prevIndex, true);
    }

    function setPlayMode(mode) {
        state.playMode = mode;
        emit('fm:mode', { playMode: mode });
    }

    function cyclePlayMode() {
        setPlayMode((state.playMode + 1) % 3);
    }

    function setVolume(val) {
        val = Math.max(0, Math.min(1, val));
        state.volume = val;
        state.isMuted = false;
        audio.volume = val;
        audio.muted = false;
        localStorage.setItem('music-player-volume', val.toString());
        emit('fm:volume', { volume: val, isMuted: false });
    }

    function toggleMute() {
        state.isMuted = !state.isMuted;
        audio.muted = state.isMuted;
        emit('fm:volume', { volume: state.volume, isMuted: state.isMuted });
    }

    function seek(percent) {
        if (!audio.duration) return;
        audio.currentTime = Math.max(0, Math.min(1, percent)) * audio.duration;
    }

    function seekToTime(time) {
        if (!audio.duration) return;
        audio.currentTime = Math.max(0, Math.min(time, audio.duration));
    }

    function playTrackByIndex(index) {
        if (index === state.currentIndex && !audio.paused) {
            togglePlay();
        } else {
            loadTrack(index, true);
        }
    }

    // ── Audio events → broadcast ─────────────────────────────
    audio.addEventListener('timeupdate', function () {
        if (isNaN(audio.duration)) return;
        var ct = audio.currentTime;
        var dur = audio.duration;
        var pct = (ct / dur) * 100;

        emit('fm:time', {
            currentTime: ct,
            duration: dur,
            progress: pct,
            currentTimeStr: formatTime(ct),
            durationStr: formatTime(dur)
        });

        syncLrcIndex();
    });

    audio.addEventListener('ended', function () {
        playNext(true);
    });

    audio.addEventListener('error', function () {
        state.error = 'Audio playback error';
        emit('fm:error', { message: state.error });
    });

    // ── Meting track resolution ─────────────────────────────
    async function resolveMetingTracks(playlist) {
        var base = (metingApiBase || 'https://mu.tsh520.cn/api') + '?server=';
        for (var i = 0; i < playlist.length; i++) {
            var track = playlist[i];
            if (track.metingServer && track.metingId && !track.url) {
                try {
                    var s = encodeURIComponent(track.metingServer);
                    var id = encodeURIComponent(track.metingId);
                    var res = await fetch(base + s + '&type=song&id=' + id);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    var raw = await res.json();
                    var data = Array.isArray(raw) ? raw[0] : raw;
                    if (data) {
                        if (data.url) track.url = data.url;
                        if (data.pic && !track.pic) track.pic = data.pic;
                        if (data.lrc && !track.lrc) track.lrc = data.lrc;
                        track.artist = track.artist || data.author || data.artist || '';
                        track.name = (track.name && track.name !== track.metingId) ? track.name : (data.title || track.name);
                    }
                } catch(e) {
                    console.warn('[MusicManager] Meting resolve failed:', track.name, e);
                }
            }
        }
        return playlist;
    }

    // ── Init (idempotent) ────────────────────────────────────
    async function init() {
        if (state.initialized || state.initializing) return;
        state.initializing = true;

        try {
            if (config.mode === 'meting' && config.meting) {
                await fetchMetingData();
            } else if (config.mode === 'local') {
                state.playlist = config.localPlaylist || [];
            }

            // 自动加载 bangumi 播放列表（构建时注入）
            var bangumi = [];
            try { bangumi = JSON.parse(bangumiPlaylistJson || '[]'); } catch(e) {}
            if (config.mode !== 'meting' && bangumi.length > 0 && !_externalLoaded) {
                var resolved = await resolveMetingTracks(bangumi);
                state.playlist = resolved;
                _externalLoaded = true;
            }

            if (state.playlist.length > 0) {
                // Apply volume
                audio.volume = state.volume;

                var startIndex = 0;
                if (state.playMode === 2) {
                    startIndex = Math.floor(Math.random() * state.playlist.length);
                }

                state.initialized = true;

                emit('fm:init', {
                    playlist: state.playlist,
                    playMode: state.playMode,
                    volume: state.volume,
                    isMuted: state.isMuted
                });

                loadTrack(startIndex, false);
            } else {
                state.initialized = true;
                emit('fm:init', {
                    playlist: [],
                    playMode: state.playMode,
                    volume: state.volume,
                    isMuted: state.isMuted
                });
                emit('fm:error', { message: config.i18n.noSongs });
            }
        } catch (e) {
            console.error('Music Manager init error:', e);
            state.initialized = true;
            emit('fm:init', {
                playlist: [],
                playMode: state.playMode,
                volume: state.volume,
                isMuted: state.isMuted
            });
            emit('fm:error', { message: config.i18n.error });

            state.initializing = false;

    function loadExternalPlaylist(playlist) {
        if (!playlist || playlist.length === 0) return;

	(function() {
		function initDesktopDropdowns() {
			var dropdowns = document.querySelectorAll('[data-dropdown]');

			dropdowns.forEach(function(dropdown) {
				var trigger = dropdown.querySelector('[data-dropdown-trigger]');
				var menu = dropdown.querySelector('[data-dropdown-menu]');
				if (!trigger || !menu) return;

				// 清除旧的事件监听器（通过克隆节点）
				var newTrigger = trigger.cloneNode(true);
				trigger.parentNode && trigger.parentNode.replaceChild(newTrigger, trigger);

				// 点击触发器 → 切换下拉菜单
				newTrigger.addEventListener('click', function(e) {
					e.preventDefault();
					e.stopPropagation();
					dropdown.classList.toggle('dropdown-open');
					var isOpen = dropdown.classList.contains('dropdown-open');
					newTrigger.setAttribute('aria-expanded', String(isOpen));
				});

				// 键盘导航支持
				newTrigger.addEventListener('keydown', function(e) {
					if (e.key === 'ArrowDown') {
						e.preventDefault();
						dropdown.classList.add('dropdown-open');
						newTrigger.setAttribute('aria-expanded', 'true');
						var firstItem = menu.querySelector('.dropdown-item');
						if (firstItem) firstItem.focus();
					} else if (e.key === 'Escape') {
						dropdown.classList.remove('dropdown-open');
						newTrigger.setAttribute('aria-expanded', 'false');
						newTrigger.focus();
					}
				});
			});

			// 点击外部关闭所有下拉菜单
			document.addEventListener('click', function(e) {
				var target = e.target;
				dropdowns.forEach(function(dropdown) {
					if (!dropdown.contains(target)) {
						dropdown.classList.remove('dropdown-open');
						var trigger = dropdown.querySelector('[data-dropdown-trigger]');
						if (trigger) trigger.setAttribute('aria-expanded', 'false');
					}
				});
			});

			// Escape 关闭所有下拉菜单
			document.addEventListener('keydown', function(e) {
				if (e.key === 'Escape') {
					dropdowns.forEach(function(dropdown) {
						dropdown.classList.remove('dropdown-open');
						var trigger = dropdown.querySelector('[data-dropdown-trigger]');
						if (trigger) {
							trigger.setAttribute('aria-expanded', 'false');
							trigger.focus();
						}
					});
				}
			});
		}

		// 首次加载时初始化
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', initDesktopDropdowns);
		} else {
			initDesktopDropdowns();
		}

		// Swup 导航后重新初始化
		document.addEventListener('swup:contentReplaced', initDesktopDropdowns);
	})();

						if (data) {
							if (data.url) track.url = data.url;
							if (data.pic && !track.pic) track.pic = data.pic;
							if (data.lrc && !track.lrc) track.lrc = data.lrc;
